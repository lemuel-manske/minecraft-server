# =============================================================================
# Server Identity
# =============================================================================

# Message displayed in the server list below the server name
motd=jej

# IP address to bind the server to. Leave blank to bind to all interfaces
server-ip=

# Port the server listens on for player connections
server-port=25565

# Whether to show the server in the server list (responds to ping requests)
enable-status=true

# Hide the list of online players in the server list hover
hide-online-players=false

# =============================================================================
# World / Level
# =============================================================================

# Name of the world folder (also the world's display name)
level-name=world

# Seed used for world generation. Leave blank for a random seed
level-seed=

# World generation type (minecraft:normal, minecraft:flat, minecraft:large_biomes, etc.)
level-type=minecraft\:normal

# JSON string of generator settings, used for flat/custom world types
generator-settings={}

# Whether to generate structures (villages, dungeons, etc.)
generate-structures=false

# Maximum radius of the world border in blocks (default is effectively unlimited)
max-world-size=29999984

# =============================================================================
# Gameplay
# =============================================================================

# Default game mode for new players (survival, creative, adventure, spectator)
gamemode=survival

# Server difficulty (peaceful, easy, normal, hard)
difficulty=normal

# Whether hardcore mode is enabled (players are banned on death)
hardcore=false

# Whether PvP (player vs. player damage) is enabled
pvp=true

# Whether players are allowed to fly (required for modpacks with flight mods)
allow-flight=true

# Whether the Nether dimension is enabled
allow-nether=false

# Whether players are forced into the default game mode on join
force-gamemode=false

# =============================================================================
# Players
# =============================================================================

# Maximum number of players allowed on the server simultaneously
max-players=20

# Authenticate players against Mojang's session servers.
# Set to false for offline/cracked clients or when behind a proxy
online-mode=false

# Whether the whitelist is active
white-list=true

# Whether to kick non-whitelisted players when the whitelist is updated via /whitelist reload
enforce-whitelist=true

# Permission level granted to ops (1=bypass spawn protection, 2=commands, 3=ban/kick, 4=op others)
op-permission-level=4

# Minutes of idle time before a player is kicked. 0 = never kick idle players
player-idle-timeout=0

# Radius (in blocks) around the world spawn that non-ops cannot build in. 0 = no protection
spawn-protection=0

# Whether to require players to have a signed public key (Mojang profile enforcement)
enforce-secure-profile=true

# Block connections from players using proxy/VPN connections
prevent-proxy-connections=false

# =============================================================================
# Mob Spawning
# =============================================================================

# Whether passive animals (cows, pigs, etc.) spawn naturally
spawn-animals=true

# Whether hostile monsters spawn naturally
spawn-monsters=true

# Whether villagers (NPCs) spawn naturally
spawn-npcs=true

# =============================================================================
# Performance & Network
# =============================================================================

# Chunk view distance sent to clients (in chunks). Lower = better server performance
view-distance=8

# Distance at which game logic (mob AI, redstone, etc.) is simulated (in chunks)
simulation-distance=6

# Percentage of the view distance at which entities are broadcast to clients
entity-broadcast-range-percentage=100

# Packet size (bytes) threshold before compression is applied. -1 = disabled, 0 = all packets
network-compression-threshold=256

# Use Linux epoll networking for improved performance on Linux hosts
use-native-transport=true

# Whether chunk writes are synchronous. Disabling can improve performance but risks corruption
sync-chunk-writes=true

# Maximum milliseconds per tick before the watchdog crashes the server. -1 = disabled
max-tick-time=-1

# Maximum number of consecutive neighbor block updates before the chain is stopped (lag prevention)
max-chained-neighbor-updates=1000000

# Maximum packets per second from a single connection before throttling. 0 = unlimited
rate-limit=0

# =============================================================================
# Resource Pack
# =============================================================================

# URL to a resource pack to offer players on join. Leave blank to disable
resource-pack=

# SHA-1 hash of the resource pack for integrity verification. Leave blank if not used
resource-pack-sha1=

# Text shown to players in the resource pack prompt dialog (supports JSON text)
resource-pack-prompt=

# Whether to kick players who decline the resource pack
require-resource-pack=false

# =============================================================================
# Data Packs
# =============================================================================

# Comma-separated list of data packs enabled by default on new worlds
initial-enabled-packs=vanilla

# Comma-separated list of data packs disabled by default on new worlds
initial-disabled-packs=

# =============================================================================
# Commands & Functions
# =============================================================================

# Whether command blocks are enabled
enable-command-block=true

# Permission level required to use functions (1–4, same scale as op-permission-level)
function-permission-level=2

# Whether output from the server console is broadcast to ops in-game
broadcast-console-to-ops=true

# =============================================================================
# RCON (Remote Console)
# =============================================================================

# Whether RCON (remote console) is enabled
enable-rcon=false

# Port RCON listens on
rcon.port=25575

# Password required to connect via RCON. Leave blank if RCON is disabled
rcon.password=

# Whether RCON command output is broadcast to ops in-game
broadcast-rcon-to-ops=true

# =============================================================================
# Query (GameSpy4 Protocol)
# =============================================================================

# Whether the GameSpy4 query protocol is enabled (used by server list tools)
enable-query=false

# Port the query listener binds to
query.port=25565

# =============================================================================
# Monitoring & Security
# =============================================================================

# Whether JMX monitoring is enabled (for external JVM monitoring tools)
enable-jmx-monitoring=false

# Path to a text filtering config file (for chat filtering services). Leave blank to disable
text-filtering-config=
